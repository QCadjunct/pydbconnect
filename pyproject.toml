[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydatabaseconnection"
version = "0.1.0"
authors = [
    { name = "Peter Heller", email = "your.email@example.com" }
]
description = "A flexible database connection management library"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Database",
]
keywords = ["database", "connection", "sql", "orm"]

dependencies = [
    "pandas>=1.3.0",
    "pyodbc>=4.0.30",
    "psycopg2-binary>=2.9.1",
    "mysql-connector-python>=8.0.26",
    "sqlalchemy>=1.4.23",
    "python-dotenv>=0.19.0",
    "keyring>=23.0.1",
    "prettytable>=2.1.0",
    "typing_extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=21.0",
    "isort>=5.0",
    "mypy>=0.910",
    "flake8>=3.9",
]

[project.urls]
"Homepage" = "https://github.com/yourusername/pydatabaseconnection"
"Bug Tracker" = "https://github.com/yourusername/pydatabaseconnection/issues"

[tool.setuptools]
packages = ["pydatabaseconnection"]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true