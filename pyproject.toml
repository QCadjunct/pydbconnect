[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydatabaseconnection"
version = "0.2.0"
authors = [
    { name = "Peter Heller", email = "your.email@example.com" }
]
description = "A flexible database connection and transfer management library"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "database",
    "connection",
    "sql",
    "orm",
    "data transfer",
    "etl",
    "parquet",
    "arrow",
    "avro",
    "orc"
]

dependencies = [
    # Core dependencies
    "pandas>=1.3.0",
    "pyodbc>=4.0.30",
    "psycopg2-binary>=2.9.1",
    "mysql-connector-python>=8.0.26",
    "sqlalchemy>=1.4.23",
    "python-dotenv>=0.19.0",
    "keyring>=23.0.1",
    "prettytable>=2.1.0",
    "typing_extensions>=4.0.0",
    
    # Format support
    "pyarrow>=7.0.0",
    "fastparquet>=0.8.1",
    "fastavro>=1.4.0",
    "pyorc>=0.6.0",
    "duckdb>=0.3.1",
    
    # Utilities
    "sqlparse>=0.4.2",
    "chardet>=4.0.0",
    "psutil>=5.8.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "pytest-benchmark>=3.4.1",
    
    # Code quality
    "black>=21.0",
    "isort>=5.0",
    "mypy>=0.910",
    "flake8>=3.9",
    "pylint>=2.8.0",
    
    # Type checking
    "types-pyarrow",
    "types-psutil",
    "types-chardet",
]

formats = [
    "pyarrow>=7.0.0",
    "fastparquet>=0.8.1",
    "fastavro>=1.4.0",
    "pyorc>=0.6.0",
]

monitoring = [
    "prometheus_client>=0.12.0",
    "opentelemetry-api>=1.9.0",
    "opentelemetry-sdk>=1.9.0",
]

[project.urls]
"Homepage" = "https://github.com/yourusername/pydatabaseconnection"
"Bug Tracker" = "https://github.com/yourusername/pydatabaseconnection/issues"
"Documentation" = "https://pydatabaseconnection.readthedocs.io/"

[tool.setuptools]
packages = ["pydatabaseconnection"]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=pydatabaseconnection"
testpaths = ["tests"]